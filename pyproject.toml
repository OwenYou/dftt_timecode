[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "dftt-timecode"
version = "1.0.0b3"
description = "Timecode library for film and TV industry, supports HFR and a bunch of cool features"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-2.1-only"
authors = [
    {name = "You Ziyuan", email = "hikaridragon0216@gmail.com"},
    {name = "Wheheo Hu", email = "wheheohu@outlook.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
]
keywords = ["timecode", "video", "film", "television", "smpte", "hfr"]

dependencies = []

[project.urls]
Homepage = "https://github.com/OwenYou/dftt_timecode"
Documentation = "https://owenyou.github.io/dftt_timecode/"
Repository = "https://github.com/OwenYou/dftt_timecode"
Issues = "https://github.com/OwenYou/dftt_timecode/issues"

[tool.uv.build-backend]
module-root = ""
source-exclude = [".DS_Store", "**/.DS_Store"]
wheel-exclude = [".DS_Store", "**/.DS_Store"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["test"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "sphinx>=7.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "myst-parser>=4.0.0",
    "sphinx-intl>=2.0.0",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]
